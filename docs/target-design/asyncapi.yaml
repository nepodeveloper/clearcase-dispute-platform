asyncapi: '3.0.0'
info:
  title: ClearCase domain event catalogue
  version: 1.0.0
  description: Versioned dispute event contract. PR-17 implements durable local outbox dispatch; PR-18 adds opt-in Kafka transport and inbox deduplication.
servers:
  localKafka:
    host: localhost:9092
    protocol: kafka
channels:
  disputeCaseEvents:
    address: disputes.case-events.v1
    description: Ordered per dispute ID using aggregateId as the Kafka message key.
    messages:
      caseSubmitted:
        $ref: '#/components/messages/DisputeSubmitted'
      caseTransitioned:
        $ref: '#/components/messages/DisputeTransitioned'
  financialOperationEvents:
    address: disputes.operations.v1
    messages:
      reversalRequested:
        $ref: '#/components/messages/ReversalRequested'
operations:
  publishDisputeSubmitted:
    action: send
    channel:
      $ref: '#/channels/disputeCaseEvents'
    messages:
      - $ref: '#/channels/disputeCaseEvents/messages/caseSubmitted'
  publishDisputeTransitioned:
    action: send
    channel:
      $ref: '#/channels/disputeCaseEvents'
    messages:
      - $ref: '#/channels/disputeCaseEvents/messages/caseTransitioned'
  publishReversalRequested:
    action: send
    channel:
      $ref: '#/channels/financialOperationEvents'
    messages:
      - $ref: '#/channels/financialOperationEvents/messages/reversalRequested'
components:
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, eventVersion, aggregateId, aggregateVersion, occurredAt, correlationId, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        eventVersion: { type: integer, minimum: 1, description: Event schema version; currently 1. }
        aggregateId: { type: string, format: uuid }
        aggregateVersion: { type: integer, format: int64, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        causationId: { type: string }
        payload: { type: object }
  messages:
    DisputeSubmitted:
      name: DisputeSubmitted
      title: Dispute Submitted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    DisputeTransitioned:
      name: DisputeTransitioned
      title: Dispute case state transitioned
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    ReversalRequested:
      name: ReversalRequested
      title: Debit order reversal requested (not settled)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'

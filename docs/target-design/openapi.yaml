openapi: 3.1.0
info:
  title: ClearCase Dispute Platform API
  version: 1.0.0
  description: >-
    Target-design contract with implemented customer UX (PR-22) and staff slices documented below.
    Future features remain proposed; the Development OpenAPI endpoint describes the running build.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: List and search customer-owned transactions
      description: >-
        Implemented page-number pagination, including pending transactions. Search is a trimmed,
        case-insensitive literal substring of description, merchant or reference (maximum 100 characters).
        Owner, search, type and date filters precede counting and pagination. Ordering is transactionDate
        descending then id ascending. Responses are private, no-store. /v1/transactions remains an alias.
      parameters:
        - $ref: '#/components/parameters/CustomerPageSize'
        - in: query
          name: pageNumber
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: transactionType
          schema:
            $ref: '#/components/schemas/TransactionKindPascal'
        - in: query
          name: fromDate
          description: Inclusive UTC calendar date; must not follow toDate.
          schema: { type: string, format: date }
        - in: query
          name: toDate
          description: Inclusive UTC calendar date.
          schema: { type: string, format: date }
      responses:
        '200':
          description: A page of owned transactions
          content:
            application/json:
              schema:
                type: object
                required: [items, pageNumber, pageSize, totalCount, totalPages, hasNextPage]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pageNumber: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
                  totalCount: { type: integer, minimum: 0 }
                  totalPages: { type: integer, minimum: 0 }
                  hasNextPage: { type: boolean }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Read owned transaction details and an existing-case link
      description: Missing and other-customer IDs both return 404. Responses are private, no-store.
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned transaction; optional fields are omitted when absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /disputes:
    get:
      operationId: listDisputes
      summary: List customer-owned disputes
      parameters:
        - $ref: '#/components/parameters/CustomerPageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paged case list
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisputeSummary'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDispute
      summary: Create a case; does not itself reverse funds
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispute'
      responses:
        '201':
          description: >-
            Case durably created, or the original case (current state) returned for an identical
            Idempotency-Key replay, marked with Idempotent-Replayed: true
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              description: Present with value true only when the response replays an earlier submission
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: dispute.activeCaseExists, or dispute.idempotencyKeyReused for the same key with a different payload
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /disputes/{disputeId}:
    get:
      operationId: getDispute
      summary: Get an owned dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /disputes/{disputeId}/events:
    get:
      operationId: listCaseTimelineEvents
      summary: Immutable customer-facing case timeline
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: Timeline ordered by sequence number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '404':
          $ref: '#/components/responses/Problem'
  /agent/disputes:
    get:
      operationId: listAgentDisputes
      summary: Search the synthetic bank-wide Agent dispute queue
      description: >-
        Requires BankEmployeeAccess. The current assessment visibility scope includes every
        persisted synthetic dispute and does not imply assignment. Search matches reference,
        transaction description, or reason code. Results use stable createdAt-descending,
        reference-ascending ordering and bounded cursor pagination.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/TransactionKindPascal'
        - in: query
          name: caseStatus
          schema:
            $ref: '#/components/schemas/CaseStatus'
      responses:
        '200':
          description: A page of minimal persisted operational case summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDisputePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}:
    get:
      operationId: getAgentDispute
      summary: Read an operational case investigation projection
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
      responses:
        '200':
          description: Case, transaction, persisted workflow facts, timeline and private notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDisputeDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}/commands:
    post:
      operationId: processAgentDisputeCommand
      summary: Apply a version-guarded staff case command
      description: >-
        Implemented PR-29 API. Requires an Agent or Supervisor session in the existing bank-wide scope
        and CSRF, not a simulation key. The stored case category selects the workflow.
        Owner and employee identity never come from request JSON. State/version, timeline,
        employee audit and outbox commit atomically. An active escalation blocks processing.
        Repeating a committed request with its old version returns 409, without another effect.
        Financial adapters and merchant acceptance/contest/representment inputs are simulated only
        in Development/Testing; unconfigured external processing returns 503 without writes.
        Existing eligibility checks remain in force. Approval never confirms funds.
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffDisputeCommand'
      responses:
        '200':
          description: Updated customer-safe case with its new version and timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeCommandResult'
        '400':
          description: Invalid command/category, expectedVersion or evidence; or invalid CSRF
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: dispute.concurrencyConflict, dispute.invalidTransition or dispute.activeEscalation
          $ref: '#/components/responses/Problem'
        '503':
          description: dispute.processingUnavailable; no transition committed
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}/notes:
    get:
      operationId: listInvestigationNotes
      summary: List private append-only investigation notes
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
      responses:
        '200':
          description: Notes ordered by persisted creation timestamp and unique ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestigationNote'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvestigationNote
      summary: Append a private investigation note
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationNote'
      responses:
        '201':
          description: Note created or original note replayed for the same key and text
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationNote'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Idempotency key was already used with different normalized text
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}/escalations:
    post:
      operationId: createDisputeEscalation
      summary: Escalate an eligible dispute for independent Supervisor review
      description: >-
        Requires AgentAccess, CSRF protection and an Idempotency-Key. The private Agent note is
        returned only to authorized bank employees; customer timeline and outbox events contain
        only safe progress text. An active escalation prevents duplicate referrals.
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeEscalation'
      responses:
        '201':
          description: Escalation created or the original escalation replayed
          headers:
            Location:
              schema: { type: string }
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Active escalation exists, dispute is ineligible, or idempotency key conflicts
          $ref: '#/components/responses/Problem'
  /supervisor/escalations:
    get:
      operationId: listSupervisorEscalations
      summary: Search the authenticated Supervisor escalation queue
      description: Requires SupervisorAccess. Search and status filters use stable, bounded cursor pagination.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/EscalationStatus' }
      responses:
        '200':
          description: Safe escalation rows without private notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}:
    get:
      operationId: getSupervisorEscalation
      summary: Read Supervisor-only escalation details and audit history
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
      responses:
        '200':
          description: Private review details, current dispute statuses, and append-only history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}/acknowledgements:
    post:
      operationId: acknowledgeSupervisorEscalation
      summary: Acknowledge an escalation before resolving it
      description: The reviewing employee must differ from the employee who created the escalation.
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Acknowledged escalation or the original action replayed
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}/resolutions:
    post:
      operationId: resolveSupervisorEscalation
      summary: Resolve an acknowledged escalation
      description: >-
        Requires a private resolution note and an independent reviewer. Resolution changes
        caseStatus only; decisionStatus and financialStatus are not changed and no funds are moved.
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeEscalation'
      responses:
        '200':
          description: Resolved escalation or the original action replayed
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: clearcase.auth
  parameters:
    CustomerPageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    AgentDisputeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupervisorEscalationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisputeId:
      name: disputeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: >-
        Customer-scoped key, one per submission draft (the web client sends a UUID). Optional for
        backward compatibility; requiring it is a planned follow-up.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    XsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema:
        type: string
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
    RequiredIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
  schemas:
    TransactionKind:
      type: string
      enum: [cardPurchase, debitOrder, bankCharge]
    TransactionKindPascal:
      type: string
      enum: [CardPurchase, DebitOrder, BankCharge]
    CaseStatus:
      type: string
      enum: [Submitted, ManualReview, Closed, UnderReview, MandateVerified, ReversalRequested, ReversalConfirmed, Rejected]
    Transaction:
      type: object
      required: [id, transactionType, description, amount, currency, transactionDate, status, isDisputable]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '750.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        transactionType:
          $ref: '#/components/schemas/TransactionKindPascal'
        transactionDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Posted, Settled, PendingAuthorization]
        isDisputable:
          type: boolean
          description: Navigation affordance, false for non-posted/pending payments. Eligibility remains authoritative.
        activeDisputeId:
          type: string
          format: uuid
          description: Owned linked case whose caseStatus is not Closed; omitted when none exists.
        merchantName:
          type: string
          description: Details only; omitted when absent and on list items.
        reference:
          type: string
          description: Details only; omitted when absent and on list items.
    CreateDispute:
      type: object
      required: [transactionId, reasonCode, description]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        reasonCode:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 15
          maxLength: 2000
    Dispute:
      $ref: '#/components/schemas/DisputeCommandResult'
    DisputeSummary:
      type: object
      required: [id, reference, transactionId, category, caseStatus, decisionStatus, financialStatus,
        createdAt, statusDescription, transaction]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        transactionId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string, enum: [Pending, Approved, Rejected] }
        financialStatus: { type: string, enum: [NotInitiated, Requested, Confirmed, Failed, OutcomeUnknown] }
        createdAt: { type: string, format: date-time }
        statusDescription: { type: string }
        transaction: { $ref: '#/components/schemas/DisputedTransaction' }
    DisputedTransaction:
      type: object
      required: [description, amount, currency, transactionDate]
      additionalProperties: false
      properties:
        description: { type: string }
        merchantName: { type: string, description: Omitted when absent. }
        amount: { type: string, pattern: '^-?[0-9]+\.[0-9]{2}$', example: '750.00' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        transactionDate: { type: string, format: date-time }
    TimelineEvent:
      $ref: '#/components/schemas/AgentTimelineEvent'
    PageInfo:
      type: object
      required: [hasNextPage]
      additionalProperties: false
      properties:
        hasNextPage:
          type: boolean
        nextCursor:
          type: string
    AgentPageInfo:
      type: object
      required: [hasNextPage]
      additionalProperties: false
      properties:
        hasNextPage:
          type: boolean
        nextCursor:
          type: string
    AgentDisputePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentDispute'
        pageInfo:
          $ref: '#/components/schemas/AgentPageInfo'
    AgentDispute:
      type: object
      required: [id, reference, customerReference, category, transactionDescription, amountMinorUnits, currency, reasonCode, caseStatus, decisionStatus, financialStatus, createdAt, lastActivityAt, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerReference: { type: string, description: Stable pseudonymous reference derived from synthetic customer ID }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        transactionDescription: { type: string }
        amountMinorUnits: { type: string, pattern: '^-?[0-9]+$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        reasonCode: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    AgentDisputeDetail:
      type: object
      required: [id, reference, customerReference, category, reasonCode, customerStatement, eligibilityOutcome, eligibilityPolicyVersion, caseStatus, decisionStatus, financialStatus, createdAt, version, transaction, timeline, notes]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerReference: { type: string }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        reasonCode: { type: string }
        customerStatement: { type: string }
        eligibilityOutcome: { type: string }
        eligibilityPolicyVersion: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        transaction:
          type: object
          required: [description, amountMinorUnits, currency, transactionDate]
          properties:
            description: { type: string }
            amountMinorUnits: { type: string, pattern: '^-?[0-9]+$' }
            currency: { type: string }
            transactionDate: { type: string, format: date-time }
            mandateType: { type: string }
            collectionDate: { type: string, format: date }
            mandateAuthorised: { type: boolean }
            mandateMatchesCollection: { type: boolean }
        reversalOperationReference: { type: string }
        bankChargeAdjustmentReference: { type: string }
        cardWorkflow:
          type: object
          properties:
            reference: { type: string }
            reasonCode: { type: string }
            status: { type: string }
            lastOperationOutcome: { type: string }
        activeEscalation:
          $ref: '#/components/schemas/AgentActiveEscalation'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/AgentTimelineEvent'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationNote'
    AgentTimelineEvent:
      type: object
      required: [id, sequenceNumber, eventType, caseStatus, description, occurredAt]
      properties:
        id: { type: string, format: uuid }
        sequenceNumber: { type: integer }
        eventType: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    StaffDisputeCommand:
      type: object
      required: [command, expectedVersion]
      properties:
        command:
          type: string
          description: Case-sensitive; only commands for the stored category and current workflow state are accepted.
          enum: [StartReview, VerifyMandate, CompleteInvestigation, RequestReversal, ExecuteReversal,
            ReconcileReversal, Initiate, ForwardToAcquirer, MerchantAccept, MerchantContest,
            ReceiveRepresentment, ReviewRepresentment, Approve, Reject, RequestSettlement,
            ExecuteSettlement, RequestAdjustment, ExecuteAdjustment, Close]
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        evidence:
          type: [object, 'null']
          description: Required only for ReceiveRepresentment; synthetic metadata, not a verified file.
          required: [id, kind]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [Receipt, DeliveryConfirmation, AuthorizationRecord] }
    DisputeCommandResult:
      type: object
      required: [id, reference, transactionId, category, reasonCode, description, caseStatus,
        decisionStatus, financialStatus, createdAt, version, statusDescription, timeline, transaction]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        transactionId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        reasonCode: { type: string }
        description: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string, enum: [Pending, Approved, Rejected] }
        financialStatus: { type: string, enum: [NotInitiated, Requested, Confirmed, Failed, OutcomeUnknown] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        statusDescription: { type: string }
        transaction: { $ref: '#/components/schemas/DisputedTransaction' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/AgentTimelineEvent' }
        chargeback:
          type: object
          required: [reference, reasonCode, status, lastOperationOutcome]
          properties:
            reference: { type: string }
            reasonCode: { type: string }
            status: { type: string }
            lastOperationOutcome: { type: string }
            evidence:
              type: object
              required: [id, kind, receivedAt]
              properties:
                id: { type: string, format: uuid }
                kind: { type: string, enum: [Receipt, DeliveryConfirmation, AuthorizationRecord] }
                receivedAt: { type: string, format: date-time }
    CreateInvestigationNote:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 15
          maxLength: 2000
          description: Length is validated after trimming and Unicode normalization.
    InvestigationNote:
      type: object
      required: [id, disputeId, employeeId, text, createdAt, correlationId]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        disputeId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        correlationId: { type: string }
    EscalationStatus:
      type: string
      enum: [Open, Acknowledged, Resolved]
    CreateDisputeEscalation:
      type: object
      required: [reason, note]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [Additional investigation required, Customer authorization dispute, Mandate mismatch, Policy exception review]
        note:
          type: string
          minLength: 15
          maxLength: 2000
          description: Private Agent note, trimmed and Unicode-normalized before validation.
    ResolveDisputeEscalation:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 15
          maxLength: 2000
          description: Private Supervisor note, trimmed and Unicode-normalized before validation.
    AgentActiveEscalation:
      type: object
      required: [id, reference, reason, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        reason: { type: string }
        status: { type: string, enum: [Open, Acknowledged] }
        createdAt: { type: string, format: date-time }
    SupervisorEscalationPage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupervisorEscalationListItem' }
        pageInfo: { $ref: '#/components/schemas/AgentPageInfo' }
    SupervisorEscalationListItem:
      type: object
      required: [id, reference, disputeId, disputeReference, customerReference, reason, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        disputeId: { type: string, format: uuid }
        disputeReference: { type: string }
        customerReference: { type: string }
        reason: { type: string }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        createdAt: { type: string, format: date-time }
    SupervisorEscalation:
      type: object
      required: [id, reference, disputeId, disputeReference, customerReference, category, caseStatus, decisionStatus, financialStatus, reason, status, createdByEmployeeId, createdAt, history]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        disputeId: { type: string, format: uuid }
        disputeReference: { type: string }
        customerReference: { type: string }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        reason: { type: string }
        note:
          type: string
          description: Private Agent note; returned only to an authorized Supervisor.
        status: { $ref: '#/components/schemas/EscalationStatus' }
        createdByEmployeeId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        history:
          type: array
          items: { $ref: '#/components/schemas/SupervisorEscalationAudit' }
    SupervisorEscalationAudit:
      type: object
      required: [id, action, employeeId, occurredAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [Created, Acknowledged, Resolved] }
        employeeId: { type: string, format: uuid }
        privateNote: { type: string, description: Private note visible only to authorized Supervisors. }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [pointer, code, message]
            properties:
              pointer: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Problem:
      description: RFC Problem Details with stable extension fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

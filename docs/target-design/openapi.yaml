openapi: 3.1.0
info:
  title: ClearCase Dispute Platform API
  version: 1.0.0
  description: Design-first API draft. Implementation remains separate from this contract.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: List posted customer-owned transactions
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: kind
          schema:
            $ref: '#/components/schemas/TransactionKind'
      responses:
        '200':
          description: A page of owned transactions
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Problem'
  /disputes:
    get:
      operationId: listDisputes
      summary: List customer-owned disputes
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paged case list
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispute'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDispute
      summary: Create a case; does not itself reverse funds
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispute'
      responses:
        '201':
          description: >-
            Case durably created, or the original case (current state) returned for an identical
            Idempotency-Key replay, marked with Idempotent-Replayed: true
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              description: Present with value true only when the response replays an earlier submission
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: dispute.activeCaseExists, or dispute.idempotencyKeyReused for the same key with a different payload
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /disputes/{disputeId}:
    get:
      operationId: getDispute
      summary: Get an owned dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '404':
          $ref: '#/components/responses/Problem'
  /disputes/{disputeId}/timeline-events:
    get:
      operationId: listCaseTimelineEvents
      summary: Immutable customer-facing case timeline
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: Timeline ordered by sequence number
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEvent'
        '404':
          $ref: '#/components/responses/Problem'
  /agent/disputes:
    get:
      operationId: listAgentDisputes
      summary: Search the synthetic bank-wide Agent dispute queue
      description: >-
        Requires BankEmployeeAccess. The current assessment visibility scope includes every
        persisted synthetic dispute and does not imply assignment. Search matches reference,
        transaction description, or reason code. Results use stable createdAt-descending,
        reference-ascending ordering and bounded cursor pagination.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/TransactionKindPascal'
        - in: query
          name: caseStatus
          schema:
            $ref: '#/components/schemas/CaseStatus'
      responses:
        '200':
          description: A page of minimal persisted operational case summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDisputePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}:
    get:
      operationId: getAgentDispute
      summary: Read an operational case investigation projection
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
      responses:
        '200':
          description: Case, transaction, persisted workflow facts, timeline and private notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDisputeDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}/notes:
    get:
      operationId: listInvestigationNotes
      summary: List private append-only investigation notes
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
      responses:
        '200':
          description: Notes ordered by persisted creation timestamp and unique ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestigationNote'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvestigationNote
      summary: Append a private investigation note
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationNote'
      responses:
        '201':
          description: Note created or original note replayed for the same key and text
          headers:
            Location:
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationNote'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Idempotency key was already used with different normalized text
          $ref: '#/components/responses/Problem'
  /agent/disputes/{id}/escalations:
    post:
      operationId: createDisputeEscalation
      summary: Escalate an eligible dispute for independent Supervisor review
      description: >-
        Requires AgentAccess, CSRF protection and an Idempotency-Key. The private Agent note is
        returned only to authorized bank employees; customer timeline and outbox events contain
        only safe progress text. An active escalation prevents duplicate referrals.
      parameters:
        - $ref: '#/components/parameters/AgentDisputeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeEscalation'
      responses:
        '201':
          description: Escalation created or the original escalation replayed
          headers:
            Location:
              schema: { type: string }
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Active escalation exists, dispute is ineligible, or idempotency key conflicts
          $ref: '#/components/responses/Problem'
  /supervisor/escalations:
    get:
      operationId: listSupervisorEscalations
      summary: Search the authenticated Supervisor escalation queue
      description: Requires SupervisorAccess. Search and status filters use stable, bounded cursor pagination.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/EscalationStatus' }
      responses:
        '200':
          description: Safe escalation rows without private notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}:
    get:
      operationId: getSupervisorEscalation
      summary: Read Supervisor-only escalation details and audit history
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
      responses:
        '200':
          description: Private review details, current dispute statuses, and append-only history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}/acknowledgements:
    post:
      operationId: acknowledgeSupervisorEscalation
      summary: Acknowledge an escalation before resolving it
      description: The reviewing employee must differ from the employee who created the escalation.
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Acknowledged escalation or the original action replayed
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /supervisor/escalations/{id}/resolutions:
    post:
      operationId: resolveSupervisorEscalation
      summary: Resolve an acknowledged escalation
      description: >-
        Requires a private resolution note and an independent reviewer. Resolution changes
        caseStatus only; decisionStatus and financialStatus are not changed and no funds are moved.
      parameters:
        - $ref: '#/components/parameters/SupervisorEscalationId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeEscalation'
      responses:
        '200':
          description: Resolved escalation or the original action replayed
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorEscalation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ClearCase.Session
  parameters:
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    AgentDisputeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupervisorEscalationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisputeId:
      name: disputeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: >-
        Customer-scoped key, one per submission draft (the web client sends a UUID). Optional for
        backward compatibility; requiring it is a planned follow-up.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    XsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema:
        type: string
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
    RequiredIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
  schemas:
    TransactionKind:
      type: string
      enum: [cardPurchase, debitOrder, bankCharge]
    TransactionKindPascal:
      type: string
      enum: [CardPurchase, DebitOrder, BankCharge]
    CaseStatus:
      type: string
      enum: [Submitted, ManualReview, Closed, UnderReview, MandateVerified, ReversalRequested, ReversalConfirmed, Rejected]
    Transaction:
      type: object
      required: [id, description, amountMinorUnits, currency, kind, postedAt, canDispute]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amountMinorUnits:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        kind:
          $ref: '#/components/schemas/TransactionKind'
        postedAt:
          type: string
          format: date-time
        canDispute:
          type: boolean
    CreateDispute:
      type: object
      required: [transactionId, reasonCode, description]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        reasonCode:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 15
          maxLength: 2000
        evidenceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Dispute:
      type: object
      required: [id, transactionId, type, caseStatus, financialStatus, createdAt, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionKind'
        caseStatus:
          type: string
        financialStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    TimelineEvent:
      type: object
      required: [id, sequenceNo, status, occurredAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sequenceNo:
          type: integer
        status:
          type: string
        publicDescription:
          type: string
        occurredAt:
          type: string
          format: date-time
    PageInfo:
      type: object
      required: [pageSize, hasNextPage]
      additionalProperties: false
      properties:
        pageSize:
          type: integer
        hasNextPage:
          type: boolean
        nextCursor:
          type: string
    AgentPageInfo:
      type: object
      required: [hasNextPage]
      additionalProperties: false
      properties:
        hasNextPage:
          type: boolean
        nextCursor:
          type: string
    AgentDisputePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentDispute'
        pageInfo:
          $ref: '#/components/schemas/AgentPageInfo'
    AgentDispute:
      type: object
      required: [id, reference, customerReference, category, transactionDescription, amountMinorUnits, currency, reasonCode, caseStatus, decisionStatus, financialStatus, createdAt, lastActivityAt, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerReference: { type: string, description: Stable pseudonymous reference derived from synthetic customer ID }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        transactionDescription: { type: string }
        amountMinorUnits: { type: string, pattern: '^-?[0-9]+$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        reasonCode: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    AgentDisputeDetail:
      type: object
      required: [id, reference, customerReference, category, reasonCode, customerStatement, eligibilityOutcome, eligibilityPolicyVersion, caseStatus, decisionStatus, financialStatus, createdAt, version, transaction, timeline, notes]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerReference: { type: string }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        reasonCode: { type: string }
        customerStatement: { type: string }
        eligibilityOutcome: { type: string }
        eligibilityPolicyVersion: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        transaction:
          type: object
          required: [description, amountMinorUnits, currency, transactionDate]
          properties:
            description: { type: string }
            amountMinorUnits: { type: string, pattern: '^-?[0-9]+$' }
            currency: { type: string }
            transactionDate: { type: string, format: date-time }
            mandateType: { type: string }
            collectionDate: { type: string, format: date }
            mandateAuthorised: { type: boolean }
            mandateMatchesCollection: { type: boolean }
        reversalOperationReference: { type: string }
        bankChargeAdjustmentReference: { type: string }
        cardWorkflow:
          type: object
          properties:
            reference: { type: string }
            reasonCode: { type: string }
            status: { type: string }
            lastOperationOutcome: { type: string }
        activeEscalation:
          $ref: '#/components/schemas/AgentActiveEscalation'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/AgentTimelineEvent'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationNote'
    AgentTimelineEvent:
      type: object
      required: [id, sequenceNumber, eventType, caseStatus, description, occurredAt]
      properties:
        id: { type: string, format: uuid }
        sequenceNumber: { type: integer }
        eventType: { type: string }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    CreateInvestigationNote:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 15
          maxLength: 2000
          description: Length is validated after trimming and Unicode normalization.
    InvestigationNote:
      type: object
      required: [id, disputeId, employeeId, text, createdAt, correlationId]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        disputeId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        correlationId: { type: string }
    EscalationStatus:
      type: string
      enum: [Open, Acknowledged, Resolved]
    CreateDisputeEscalation:
      type: object
      required: [reason, note]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [Additional investigation required, Customer authorization dispute, Mandate mismatch, Policy exception review]
        note:
          type: string
          minLength: 15
          maxLength: 2000
          description: Private Agent note, trimmed and Unicode-normalized before validation.
    ResolveDisputeEscalation:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 15
          maxLength: 2000
          description: Private Supervisor note, trimmed and Unicode-normalized before validation.
    AgentActiveEscalation:
      type: object
      required: [id, reference, reason, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        reason: { type: string }
        status: { type: string, enum: [Open, Acknowledged] }
        createdAt: { type: string, format: date-time }
    SupervisorEscalationPage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupervisorEscalationListItem' }
        pageInfo: { $ref: '#/components/schemas/AgentPageInfo' }
    SupervisorEscalationListItem:
      type: object
      required: [id, reference, disputeId, disputeReference, customerReference, reason, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        disputeId: { type: string, format: uuid }
        disputeReference: { type: string }
        customerReference: { type: string }
        reason: { type: string }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        createdAt: { type: string, format: date-time }
    SupervisorEscalation:
      type: object
      required: [id, reference, disputeId, disputeReference, customerReference, category, caseStatus, decisionStatus, financialStatus, reason, status, createdByEmployeeId, createdAt, history]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        disputeId: { type: string, format: uuid }
        disputeReference: { type: string }
        customerReference: { type: string }
        category: { $ref: '#/components/schemas/TransactionKindPascal' }
        caseStatus: { $ref: '#/components/schemas/CaseStatus' }
        decisionStatus: { type: string }
        financialStatus: { type: string }
        reason: { type: string }
        note:
          type: string
          description: Private Agent note; returned only to an authorized Supervisor.
        status: { $ref: '#/components/schemas/EscalationStatus' }
        createdByEmployeeId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        history:
          type: array
          items: { $ref: '#/components/schemas/SupervisorEscalationAudit' }
    SupervisorEscalationAudit:
      type: object
      required: [id, action, employeeId, occurredAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [Created, Acknowledged, Resolved] }
        employeeId: { type: string, format: uuid }
        privateNote: { type: string, description: Private note visible only to authorized Supervisors. }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [pointer, code, message]
            properties:
              pointer: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Problem:
      description: RFC Problem Details with stable extension fields
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

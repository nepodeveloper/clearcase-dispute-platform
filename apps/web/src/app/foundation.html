<header class="masthead">
  <a class="brand" routerLink="/" aria-label="ClearCase home">
    <span class="brand-mark" aria-hidden="true">C</span>
    <span>{{ title() }}</span>
  </a>
  <span class="environment-label">Synthetic demo</span>
</header>

<main id="main-content">
  <p class="eyebrow">Customer overview</p>
  <h1>{{ title() }}</h1>
  <p class="intro">View your recent transactions.</p>

  <div class="scope-note" data-testid="scope-note">
    <span class="scope-indicator" aria-hidden="true"></span>
    <p>Demo data only. Real customer authentication and dispute workflows are not yet available.</p>
  </div>
  <router-outlet />
</main>

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, security, migrations and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore with NuGet high/critical advisory gate
        run: dotnet restore apps/api/ClearCase.slnx -p:NuGetAudit=true -p:NuGetAuditLevel=high -warnaserror:NU1903,NU1904
      - name: Build with analyzers
        run: dotnet build apps/api/ClearCase.slnx --configuration Release --no-restore
      - name: Test and generate coverage/TRX evidence
        run: dotnet test apps/api/ClearCase.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - name: Verify migration compatibility
        run: dotnet test apps/api/ClearCase.slnx --configuration Release --no-build --filter "FullyQualifiedName~Migration" --logger "trx;LogFileName=migrations.trx" --results-directory TestResults
      - name: Require real coverage evidence
        shell: bash
        run: |
          test -n "$(find TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          grep -l '<coverage ' $(find TestResults -type f -name 'coverage.cobertura.xml') >/dev/null
      - name: Upload backend release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-evidence
          path: TestResults/
          retention-days: 30

  frontend:
    name: Frontend build, security and browser evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Install
        run: npm ci
      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: Test complete UI journeys
        run: npm run test:e2e
      - name: Upload UI screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

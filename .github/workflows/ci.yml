name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore apps/api/ClearCase.slnx
      - name: Build
        run: dotnet build apps/api/ClearCase.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test apps/api/ClearCase.slnx --configuration Release --no-build

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
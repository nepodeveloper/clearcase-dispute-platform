version: 2
updates:
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspnetcore-efcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
    ignore:
      # Angular's compiler pins a narrow TypeScript peer range; upgrade TypeScript together with Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Image majors are tied to the toolchain (net10.0 + global.json, Node 24 in CI); upgrade them deliberately.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

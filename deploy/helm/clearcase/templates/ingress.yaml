{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clearcase.fullname" . }}
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Going direct to the API lets it see the real client address through the trusted ingress controller.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "clearcase.fullname" . }}-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clearcase.fullname" . }}-web
                port: { name: http }
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clearcase.fullname" . }}-api
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clearcase.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "clearcase.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clearcase.fullname" . }}-web
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clearcase.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: {{ .Values.web.port }}
{{- end }}

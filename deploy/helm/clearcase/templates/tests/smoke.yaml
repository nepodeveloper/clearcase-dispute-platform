apiVersion: v1
kind: Pod
metadata:
  name: {{ include "clearcase.fullname" . }}-smoke
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-ec"]
      args:
        - |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://{{ include "clearcase.fullname" . }}-api/health/ready
          echo
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors http://{{ include "clearcase.fullname" . }}-web/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://{{ include "clearcase.fullname" . }}-api/api/v1/auth/me)" = "401"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }

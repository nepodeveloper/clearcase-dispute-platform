{{- $env := ternary "Development" "Production" .Values.mock.enabled }}
{{- $migrate := and (not .Values.mock.enabled) .Values.api.migrations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearcase.fullname" . }}-api
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # One SQLite writer on a ReadWriteOnce volume: the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clearcase.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearcase.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clearcase.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityIds.api }}
        runAsGroup: {{ .Values.securityIds.api }}
        fsGroup: {{ .Values.securityIds.api }}
        seccompProfile:
          type: RuntimeDefault
      {{- if $migrate }}
      initContainers:
        - name: migrate
          image: {{ include "clearcase.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["--migrate-only"]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: {{ $env }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: api
          image: {{ include "clearcase.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: {{ $env }} }
            - { name: ASPNETCORE_URLS, value: "http://+:{{ .Values.api.port }}" }
            - { name: RateLimiting__RequestsPerMinute, value: {{ .Values.api.rateLimitRequestsPerMinute | quote }} }
            - { name: FinancialOperations__WorkerEnabled, value: {{ .Values.api.financialWorkerEnabled | quote }} }
            {{- range $index, $network := .Values.api.trustedProxyNetworks }}
            - { name: Security__TrustedProxyNetworks__{{ $index }}, value: {{ $network | quote }} }
            {{- end }}
            {{- if .Values.api.otlpEndpoint }}
            - { name: Observability__OtlpEndpoint, value: {{ .Values.api.otlpEndpoint | quote }} }
            {{- end }}
            {{- if .Values.mock.enabled }}
            {{- range $account, $key := dict "Customer" "customer" "OtherCustomer" "otherCustomer" "Agent" "agent" "Supervisor" "supervisor" }}
            - name: Authentication__SeedPasswords__{{ $account }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearcase.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - { name: Messaging__Kafka__Enabled, value: "true" }
            - { name: Messaging__Kafka__BootstrapServers, value: {{ .Values.kafka.bootstrapServers | quote }} }
            {{- with .Values.kafka.securityProtocol }}
            - { name: Messaging__Kafka__SecurityProtocol, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.kafka.saslMechanism }}
            - { name: Messaging__Kafka__SaslMechanism, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.kafka.existingSecret }}
            - name: Messaging__Kafka__SaslUsername
              valueFrom: { secretKeyRef: { name: {{ .Values.kafka.existingSecret }}, key: username } }
            - name: Messaging__Kafka__SaslPassword
              valueFrom: { secretKeyRef: { name: {{ .Values.kafka.existingSecret }}, key: password } }
            {{- end }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "clearcase.fullname" .)) .Values.api.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

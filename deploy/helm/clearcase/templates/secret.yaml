{{- if and .Values.mock.enabled (not .Values.secrets.existingSecret) }}
{{- $name := include "clearcase.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    # Keep the generated passwords if the release is removed; they only seed accounts on first start.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /* Meets the Identity policy: 12+ characters with upper, lower, digit and symbol. Reused across upgrades. */}}
  {{- range $key := list "customer" "otherCustomer" "agent" "supervisor" }}
  {{ $key }}: {{ get $data $key | default (printf "Aa1!%s" (randAlphaNum 20) | b64enc) }}
  {{- end }}
{{- end }}

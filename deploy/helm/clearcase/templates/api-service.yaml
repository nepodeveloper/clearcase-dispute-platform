apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearcase.fullname" . }}-api
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "clearcase.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- if and .Values.api.persistence.enabled (not .Values.api.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clearcase.fullname" . }}-data
  labels:
    {{- include "clearcase.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
{{- end }}
